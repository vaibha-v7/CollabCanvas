services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "5000"
      MONGO_URI: "YOUR_MONGO_URI"
      REDIS_URL: "YOUR_REDIS_URL"
      JWT_SECRET: "YOUR_JWT_SECRET"
      CLIENT_URL: "http://localhost:5173"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
